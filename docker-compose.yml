services:
  qwen38-27b-gittensor-nvfp4:
    image: vllm/vllm-openai:v0.30.0 
    container_name: qwen38-27b-gittensor-nvfp4
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - /root/.cache/vllm:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # - NCCL_P2P_DISABLE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
    command:
      - gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
      - --served-model-name
      - qwen38-27b-nvfp4
      - --tensor-parallel-size
      - "2"
      - --kv-cache-dtype 
      - fp8
      - --quantization 
      - modelopt
      - --trust-remote-code 
      - --max-model-len 
      - "243040" 
      - --kv-cache-memory
      - "4182216704"
      - --max-num-seqs 
      - "16" 
      - --gpu-memory-utilization 
      - "0.97" 
      - --reasoning-parser 
      -  qwen3 
      - --enable-auto-tool-choice 
      - --tool-call-parser 
      - qwen3_xml
      - --enable-prefix-caching
      - --enable-chunked-prefill 
      - --port
      - "8000"
      - --host
      - "0.0.0.0"
      
